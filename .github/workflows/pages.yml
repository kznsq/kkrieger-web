# Publishes the playable page (web/) to GitHub Pages on every push to main:
# https://kznsq.github.io/kkrieger-web/
name: Publish the game page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # only what the page loads at run time: the page, its scripts, the
      # compiled player and the game release (the C++ sources stay out)
      - name: Collect the page files
        run: |
          mkdir _site
          cp web/index.html web/kkworker.js web/glbackend.js web/debug.js web/kkrieger.wasm web/kkrieger3383.kx _site/
          cp -r web/original _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
